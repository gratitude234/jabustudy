
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Material Detail — Jabu Study</title>
<style>
/* ── Direction: human-approachable, Jabu purple accent ─────────────────── */
:root {
  --bg:        oklch(98% 0.004 270);
  --surface:   oklch(100% 0 0);
  --fg:        oklch(20% 0.02 270);
  --muted:     oklch(52% 0.018 270);
  --border:    oklch(90% 0.006 270);
  --accent:    oklch(52% 0.22 290);        /* Jabu purple */
  --accent-lt: oklch(95% 0.06 290);
  --accent-dk: oklch(42% 0.22 290);
  --green:     oklch(55% 0.16 145);
  --green-lt:  oklch(95% 0.06 145);
  --amber:     oklch(68% 0.18 75);
  --amber-lt:  oklch(96% 0.06 75);
  --red:       oklch(55% 0.18 25);
  --red-lt:    oklch(96% 0.06 25);

  --radius-sm: 10px;
  --radius:    14px;
  --radius-lg: 18px;
  --radius-xl: 24px;

  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

  --nav-h: 56px;
  --tab-h: 56px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

/* ── Top nav ────────────────────────────────────────────────────────────── */
.topnav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--nav-h);
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: background .15s;
  flex-shrink: 0;
}
.back-btn:hover { background: oklch(96% 0.004 270); }
.back-btn svg { width: 15px; height: 15px; }

.nav-title {
  flex: 1;
  min-width: 0;
  font-size: 14px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--fg);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.icon-btn {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  transition: background .15s;
  color: var(--muted);
}
.icon-btn:hover { background: oklch(96% 0.004 270); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn.saved { color: var(--accent); border-color: var(--accent); background: var(--accent-lt); }

/* ── Layout ─────────────────────────────────────────────────────────────── */
.layout {
  max-width: 1280px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  display: grid;
  grid-template-columns: 1fr 420px;
  gap: 20px;
  align-items: start;
}

/* ── Mobile tabs ─────────────────────────────────────────────────────────── */
.mobile-tabs {
  display: none;
  position: sticky;
  top: var(--nav-h);
  z-index: 90;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
}
.mobile-tabs-inner {
  display: flex;
  gap: 0;
}
.tab-btn {
  flex: 1;
  padding: 13px 8px 11px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  border: none;
  border-bottom: 2px solid transparent;
  background: none;
  cursor: pointer;
  transition: color .15s, border-color .15s;
  text-align: center;
}
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ── Material info panel (left on desktop) ─────────────────────────────── */
.material-panel { display: flex; flex-direction: column; gap: 14px; }

.material-hero {
  background: linear-gradient(135deg, var(--accent) 0%, oklch(46% 0.22 305) 100%);
  border-radius: var(--radius-xl);
  padding: 22px 22px 20px;
  color: white;
  position: relative;
  overflow: hidden;
}
.material-hero::before {
  content: '';
  position: absolute;
  right: -20px; top: -20px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
}
.material-hero::after {
  content: '';
  position: absolute;
  right: 20px; top: 40px;
  width: 70px; height: 70px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
}

.hero-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.92);
}
.hero-badge.verified { background: rgba(52,211,153,0.25); border-color: rgba(52,211,153,0.4); }
.hero-badge.featured { background: rgba(251,191,36,0.25); border-color: rgba(251,191,36,0.4); }

.hero-meta {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.hero-icon {
  flex-shrink: 0;
  width: 52px; height: 52px;
  border-radius: var(--radius);
  background: rgba(255,255,255,0.15);
  display: grid;
  place-items: center;
}
.hero-icon svg { width: 26px; height: 26px; color: white; }
.hero-info { flex: 1; min-width: 0; }
.hero-type {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: rgba(255,255,255,0.7);
  margin-bottom: 4px;
}
.hero-title {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.25;
  color: white;
  margin-bottom: 6px;
}
.hero-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.75);
  font-weight: 500;
}

.hero-stats {
  display: flex;
  gap: 14px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.15);
}
.hero-stat {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.8);
}
.hero-stat svg { width: 13px; height: 13px; opacity: .7; }

/* ── Material actions bar ───────────────────────────────────────────────── */
.action-ba
